linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - prealloc

linters-settings:
  govet:
    # check-shadowing was a special govet setting; the analyzer is enabled
    # explicitly here instead (the `shadow` linter does not exist standalone).
    enable:
      - shadow
  gosec:
    excludes:
      - G107  # Potential HTTP request made with variable URL
      - G404  # math/rand is acceptable for non-security retry backoff jitter
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # Exported identifiers that are intentionally package-qualified
    # (e.g. ProviderError, PluginManager, RuntimeStore, RouterEngine) carry
    # an explicit package prefix by design, so revive's advisory "stutters"
    # rule does not apply. These are scoped to the specific origin packages
    # only — do NOT broaden them: new stutter findings in other packages
    # should stay visible so the repo-wide naming gate is not weakened.
    - path: internal/provider/
      linters:
        - revive
      text: "stutters"
    - path: internal/plugin/
      linters:
        - revive
      text: "stutters"
    - path: internal/runtime/
      linters:
        - revive
      text: "stutters"
    - path: internal/cache/
      linters:
        - revive
      text: "stutters"
    - path: internal/router/
      linters:
        - revive
      text: "stutters"
    - path: internal/breaker/
      linters:
        - revive
      text: "stutters"
    - path: internal/policy/
      linters:
        - revive
      text: "stutters"
    - path: internal/scheduler/
      linters:
        - revive
      text: "stutters"
    - path: internal/agent/
      linters:
        - revive
      text: "stutters"
    - path: internal/task/
      linters:
        - revive
      text: "stutters"
    - path: internal/orchestration/
      linters:
        - revive
      text: "stutters"
    - path: internal/coordinator/
      linters:
        - revive
      text: "stutters"
    - path: internal/tool/
      linters:
        - revive
      text: "stutters"

run:
  timeout: 5m
  tests: true
